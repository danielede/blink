name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Restore Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches
        key: ${{ runner.os }}-build-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-build-

    - name: Install Dependencies & Setup Developer Profile
      run: |
        chmod +x ./get_frameworks.sh
        chmod +x ./get_resources.sh
        
        # Crea il file xcconfig richiesto se non esiste
        if [ -f "./configure.sh" ]; then
          chmod +x ./configure.sh
          ./configure.sh
        elif [ -f "./setup.sh" ]; then
          chmod +x ./setup.sh
          ./setup.sh
        else
          echo 'DEVELOPMENT_TEAM = ""' > developer_setup.xcconfig
          echo 'PRODUCT_BUNDLE_IDENTIFIER = "com.blinksh.blink.custom"' >> developer_setup.xcconfig
        fi
        
        ./get_frameworks.sh
        ./get_resources.sh

    - name: Build App
      run: |
        xcodebuild -project Blink.xcodeproj -scheme Blink -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO OBJROOT=$PWD/build SYMROOT=$PWD/build

    - name: Package IPA
      run: |
        mkdir -p Payload
        cp -r build/Release-iphoneos/Blink.app Payload/
        zip -r Blink.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blink-IPA
        path: Blink.ipa
