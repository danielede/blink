name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

    - name: Restore Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/CocoaPods
          Pods
        key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pods-

    - name: Install Dependencies
      run: |
        ./get_frameworks.sh
        ./get_resources.sh

    - name: Build App
      run: |
        xcodebuild -project Blink.xcodeproj -scheme Blink -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO OBJROOT=$PWD/build SYMROOT=$PWD/build

    - name: Package IPA
      run: |
        mkdir -p Payload
        cp -r build/Release-iphoneos/Blink.app Payload/
        zip -r Blink.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blink-IPA
        path: Blink.ipa
